<!doctype html>
<html lang="fi" data-theme="auto">
	<head>

		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

		<link rel="stylesheet" href="site.css" />

	<body>
		<header class="site-header">
			<div class="header-inner">
				<a class="wordmark" href="Lightdarknav.html#alku" aria-label="Valo Studio, etusivu">
					<span class="wordmark-mark" aria-hidden="true">v.</span>
					<span>VALO STUDIO</span>
				</a>
				<input
					class="menu-checkbox"
					id="menu-toggle"
					type="checkbox"
					aria-label="Valikko"
					aria-controls="main-navigation"
				/>
				<label class="nav-toggle" for="menu-toggle">
					<i class="fa-solid fa-bars" aria-hidden="true"></i>

				</label>

					<div class="theme-control" role="group" aria-label="Väriteema">
						<button
							type="button"
							data-theme-choice="light"
							aria-label="Vaalea teema"
							title="Vaalea teema"
							aria-pressed="false"

							<i class="fa-solid fa-sun" aria-hidden="true"></i>

							type="button"
							data-theme-choice="dark"
							aria-label="Tumma teema"
							title="Tumma teema"
							aria-pressed="false"
						>
							<i class="fa-solid fa-moon" aria-hidden="true"></i>

<style>
label,button {display:block;}
.invalid-feedback {display:none;}
input:invalid:not(:focus) {
border-color: red;    
}

input:invalid:not(:focus) + .invalid-feedback {
display:block;
color: red;
}
</style>
</head>
<body>

<h2>The input pattern attribute</h2>
<form novalidate>
  <label for="etunimi">Etunimi</label>
  <input type="text" id="etunimi" name="etunimi" pattern="[A-ZÅÄÖa-zåäö]{2,25}" title="first name">
  <div class="invalid-feedback">Täytä kenttä oikein</div>
  <button>Lähetä</button>
</form>

<p><strong>Note:</strong> The pattern attribute of the input tag is not supported in Safari 10 (or earlier).</p>

</body>
